name: Offline validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-powershell-5:
    name: Windows PowerShell 5.1 / offline protocol suite
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -cne 'Desktop' -or
              $PSVersionTable.PSVersion.Major -ne 5 -or
              $PSVersionTable.PSVersion.Minor -lt 1) {
              throw "Expected Windows PowerShell 5.1; got $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)."
          }

      - name: Record runner elevation state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Informational only. scripts\install.ps1 refuses to run with
          # administrator rights, so whether this runner is elevated decides
          # whether an installer dry-run could ever run here. Recording it turns
          # that open question into data on the first push.
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $elevated = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Output "Runner identity: $($identity.Name)"
          Write-Output "Runner elevated: $elevated"

      - name: Assert the installer refuses to run elevated
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Check the assumption this whole step rests on before acting on it, so
          # a changed runner image reports itself instead of surfacing as a fake
          # security regression below.
          $elevated = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          if (-not $elevated) {
              throw "PRECONDITION NOT MET: this runner is not elevated, so install.ps1's administrator guard cannot be exercised here. This is not a guard regression - the test's assumption about hosted runners no longer holds. Re-evaluate whether this step still provides coverage."
          }
          # The hosted runner is elevated, which is exactly the condition
          # scripts\install.ps1 exists to refuse. That makes CI the one place
          # where the guard's trigger is guaranteed, so test the guard here
          # rather than assume it still works.
          #
          # -WhatIf bounds the blast radius. The guard throws before any
          # ShouldProcess call, so it does not weaken the assertion, but if the
          # guard ever regressed the installer would no-op instead of writing to
          # the runner. A regression still fails this step on the exit code.
          #
          # Start-Process with redirected streams, not '2>&1': in Windows
          # PowerShell 5.1 redirecting a native command's stderr wraps each line
          # in a NativeCommandError, which under 'Stop' aborts the step before
          # the exit code can be read.
          $installer = Join-Path $env:GITHUB_WORKSPACE 'scripts\install.ps1'
          $out = Join-Path $env:RUNNER_TEMP 'installer-elevated-out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'installer-elevated-err.txt'
          $shell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $process = Start-Process -FilePath $shell -Wait -PassThru -NoNewWindow `
              -WorkingDirectory $env:GITHUB_WORKSPACE `
              -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $installer, '-WhatIf' `
              -RedirectStandardOutput $out -RedirectStandardError $err
          $stdout = [string](Get-Content -LiteralPath $out -Raw -ErrorAction SilentlyContinue)
          $stderr = [string](Get-Content -LiteralPath $err -Raw -ErrorAction SilentlyContinue)
          Write-Output "installer exit code: $($process.ExitCode)"
          Write-Output '--- installer stdout ---'
          Write-Output $stdout
          Write-Output '--- installer stderr ---'
          Write-Output $stderr
          if ($process.ExitCode -eq 0) {
              throw 'SECURITY REGRESSION: scripts\install.ps1 exited 0 on an elevated runner. The administrator guard no longer refuses elevation.'
          }
          if ("$stdout`n$stderr" -notmatch '(?i)administrator|elevat') {
              throw "scripts\install.ps1 exited $($process.ExitCode) on an elevated runner, but its message never named elevation, so the non-zero exit may have come from an unrelated failure."
          }
          Write-Output 'PASS: the installer refused to run elevated and said why.'

      - name: Validate package and run offline tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # -SkipInstallerChecks omits the two suites that drive install.ps1:
          # tests\setup-lm-studio-offline.ps1 and tests\install-root-acl.ps1.
          # Neither can run here regardless of preference - the step above
          # asserts this runner is elevated, and the installer refuses to start
          # elevated by design. Even if it did run, this machine is discarded
          # when the job ends, so it would say nothing about installing on a
          # real workstation. Everything else still runs, including the full
          # offline protocol suite, the manifest hash check, and the static
          # parse of install.ps1 itself. Run this script with no switches on a
          # normal non-elevated workstation to cover the installer path before
          # tagging a release; that run is the only installer coverage that
          # exists anywhere.
          & .\scripts\validate-package.ps1 -SkipInstallerChecks
