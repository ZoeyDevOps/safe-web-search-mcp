name: Offline validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-powershell-5:
    name: Windows PowerShell 5.1 / offline protocol suite
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -cne 'Desktop' -or
              $PSVersionTable.PSVersion.Major -ne 5 -or
              $PSVersionTable.PSVersion.Minor -lt 1) {
              throw "Expected Windows PowerShell 5.1; got $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)."
          }

      - name: Record runner elevation state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Informational only. scripts\install.ps1 refuses to run with
          # administrator rights, so whether this runner is elevated decides
          # whether an installer dry-run could ever run here. Recording it turns
          # that open question into data on the first push.
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $elevated = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Output "Runner identity: $($identity.Name)"
          Write-Output "Runner elevated: $elevated"

      - name: Validate package and run offline tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # -SkipInstallerDryRun omits tests\setup-lm-studio-offline.ps1, the one
          # check that previews an installation. An ephemeral runner cannot
          # meaningfully validate a local installer dry-run: this machine is
          # discarded when the job ends, so a preview here says nothing about
          # installing on a real workstation. Everything else still runs,
          # including the full offline protocol suite, the manifest hash check,
          # and the static parse of install.ps1 itself. Run this script with no
          # switches on a normal non-elevated workstation to cover the
          # installer path before tagging a release.
          & .\scripts\validate-package.ps1 -SkipInstallerDryRun
