name: Offline validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-powershell-5:
    name: Windows PowerShell 5.1 / offline protocol suite
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -cne 'Desktop' -or
              $PSVersionTable.PSVersion.Major -ne 5 -or
              $PSVersionTable.PSVersion.Minor -lt 1) {
              throw "Expected Windows PowerShell 5.1; got $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)."
          }

      - name: Validate package and run offline tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\validate-package.ps1
